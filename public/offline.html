<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Nur al-Usul</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: Georgia, "Times New Roman", serif;
    background: linear-gradient(180deg, #ecfdf5 0%, #ffffff 60%);
    color: #052e22; padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(180deg, #022c22 0%, #0a0f0d 60%); color: #d1fae5; }
  }
  .card {
    max-width: 460px; text-align: center; border: 1px solid rgba(6,95,70,.25); border-radius: 16px;
    padding: 40px 32px; background: rgba(255,255,255,.7); box-shadow: 0 10px 30px rgba(6,95,70,.08);
  }
  @media (prefers-color-scheme: dark) { .card { background: rgba(2,44,34,.55); } }
  .star { width: 40px; height: 40px; margin: 0 auto 18px; transform: rotate(45deg); border-radius: 6px;
    border: 1.5px solid #f59e0b; display: flex; align-items: center; justify-content: center; }
  .star::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { font-size: 14px; line-height: 1.7; margin: 0 0 6px; opacity: .85; }
  .lang { font-size: 13px; margin-top: 14px; opacity: .75; }
  .ar { direction: rtl; font-size: 15px; }
  button {
    margin-top: 22px; padding: 10px 22px; border-radius: 999px; border: none; cursor: pointer;
    background: #065f46; color: #fff; font-size: 14px; font-family: inherit;
  }
  button:hover { background: #047857; }
</style>
</head>
<body>
<main class="card">
  <div class="star" aria-hidden="true"></div>
  <h1>You are offline</h1>
  <p>Nur al-Usul could not reach the network. Pages you visited recently may still be available — try going back.</p>
  <p class="lang">آپ آف لائن ہیں — حال میں دیکھے گئے صفحات دستیاب ہو سکتے ہیں۔</p>
  <p class="lang ar">أنت غير متصل بالإنترنت — قد تظل الصفحات التي زرتها مؤخرًا متاحة.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
